<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var k = "bail-reckoner-theme";
          var v = localStorage.getItem(k);
          document.documentElement.setAttribute(
            "data-theme",
            v === "light" || v === "dark" ? v : "dark"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bail Reckoner is a rule-based legal-tech tool that evaluates bail eligibility for undertrial prisoners using Indian statutory sections, time served, and judicial risk factors." />
    <meta name="theme-color" content="#0b0b0f" />
    <meta property="og:title" content="Bail Reckoner" />
    <meta property="og:description" content="Evaluate bail eligibility using statutory rules, time served, and risk factors. Covers 442 offences across IPC, IT Act, POCSO, NDPS, SC/ST Act, and Foreigners Act." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bail-reckoner.vercel.app" />
    <title>Bail Reckoner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
